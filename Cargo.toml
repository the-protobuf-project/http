# Workspace manifest.
#
# Layout: every Rust crate lives under transcode-rs/, beside the Go runtime in
# transcode-go/. The Go modules have their own build systems and are outside this
# workspace; nothing here references them.

[workspace]
resolver = "3"
members = ["transcode-rs/transcode", "transcode-rs/transcode-build", "examples/music-rs"]

# Inherited by every crate via `field.workspace = true`, so version, license and
# metadata are set in exactly one place at release time.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/the-protobuf-project/http"
homepage = "https://github.com/the-protobuf-project/http"
authors = ["the-protobuf-project"]
keywords = ["grpc", "http", "rest", "protobuf", "aip"]
categories = ["network-programming", "web-programming::http-server"]

[workspace.dependencies]
# --- gRPC and protobuf ---------------------------------------------------
# tonic is the transport under the Rust runtime. The crate is named transcode
# rather than tonic-http because the surface it implements is defined by
# google.api.http and AIP-127, not by tonic.
tonic = { version = "0.14", default-features = false }
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"

# --- HTTP core -----------------------------------------------------------
http = "1.4"
http-body = "1"
http-body-util = "0.1"
bytes = "1"

# --- tower ---------------------------------------------------------------
# The gateway is a tower::Service, which is what lets one handler sit behind
# both an HTTP/1.1 listener and an HTTP/3 one without knowing which.
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
tower-http = { version = "0.6", default-features = false }

# --- HTTP/1.1 + TLS ------------------------------------------------------
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-pemfile = "2"

# --- HTTP/3 over QUIC ----------------------------------------------------
# h3 rides on quinn, which brings its own rustls. Kept behind the `http3`
# feature so a deployment that only serves TCP does not compile a QUIC stack.
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["ring", "runtime-tokio", "rustls"] }

# --- serialization -------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
percent-encoding = "2.3"

# --- runtime and diagnostics ---------------------------------------------
tokio = { version = "1", features = ["rt", "net", "macros"] }
futures-util = { version = "0.3", default-features = false }
thiserror = "2.0"
tracing = "0.1"

# --- dev -----------------------------------------------------------------
tokio-test = "0.4"

transcode = { path = "transcode-rs/transcode", version = "0.1.0" }

# Lints are declared once and inherited with `[lints] workspace = true`.
[workspace.lints.rust]
# Documentation is not optional here: every public item carries an explanation
# of what it is for, and this makes a missing one a build failure rather than
# something to notice in review.
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# Panicking in a gateway turns one bad request into a dropped connection, so
# the paths that could do it are surfaced rather than trusted.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
doc_markdown = "warn"

# Release profile: this is a proxy, so binary size and startup matter as much as
# throughput.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"       # a caught panic becomes a 500; it must not abort

# Optimize dependencies even in dev, so a debug build is usable for load tests.
[profile.dev.package."*"]
opt-level = 2
