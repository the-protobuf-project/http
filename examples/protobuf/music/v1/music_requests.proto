// Request and response messages for the Catalog service.
//
// Split from music_service.proto to keep each file readable; the service and
// its messages are one unit conceptually.
syntax = "proto3";

package music.v1;

import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "music/v1/music.proto";

option go_package = "music.example.com/gen/music/v1;musicv1";
option java_multiple_files = true;
option java_outer_classname = "MusicRequestsProto";
option java_package = "com.music.v1";

// Request for GetArtist.
message GetArtistRequest {
  // The resource name of the artist to retrieve.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "music.example.com/Artist"}
  ];
}

// Request for ListArtists.
message ListArtistsRequest {
  // The maximum number of artists to return.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous response.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // An AIP-160 filter expression.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response for ListArtists.
message ListArtistsResponse {
  // The artists in the catalog.
  repeated Artist artists = 1;

  // A token to retrieve the next page, or empty if this is the last.
  string next_page_token = 2;
}

// Request for CreateArtist.
message CreateArtistRequest {
  // The artist to create.
  Artist artist = 1 [(google.api.field_behavior) = REQUIRED];

  // The id to use for the artist, which becomes the last path segment.
  string artist_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // An idempotency key. (AIP-155)
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Request for UpdateArtist.
message UpdateArtistRequest {
  // The artist to update. Its `name` field identifies it.
  Artist artist = 1 [(google.api.field_behavior) = REQUIRED];

  // Which fields to update. An absent mask replaces every mutable field.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request for DeleteArtist.
message DeleteArtistRequest {
  // The resource name of the artist to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "music.example.com/Artist"}
  ];

  // Whether to delete the artist's tracks along with it. (AIP-135)
  //
  // An artist has child tracks, so deleting one without this set would either
  // orphan them or silently cascade. Requiring the caller to ask makes the
  // destructive case explicit; without it, deleting an artist that still has
  // tracks fails with FAILED_PRECONDITION.
  bool force = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request for GetTrack.
message GetTrackRequest {
  // The resource name of the track to retrieve.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "music.example.com/Track"}
  ];
}

// Request for ListTracks.
message ListTracksRequest {
  // The artist whose tracks to list.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "music.example.com/Track"}
  ];

  // The maximum number of tracks to return.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous response.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response for ListTracks.
message ListTracksResponse {
  // The artist's tracks.
  repeated Track tracks = 1;

  // A token to retrieve the next page, or empty if this is the last.
  string next_page_token = 2;
}

// Request for CreateTrack.
message CreateTrackRequest {
  // The artist to add the track to.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "music.example.com/Track"}
  ];

  // The track to create.
  Track track = 2 [(google.api.field_behavior) = REQUIRED];

  // The id to use for the track, which becomes the last path segment.
  string track_id = 3 [(google.api.field_behavior) = OPTIONAL];

  // An idempotency key. (AIP-155)
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Request for UpdateTrack.
message UpdateTrackRequest {
  // The track to update. Its `name` field identifies it.
  Track track = 1 [(google.api.field_behavior) = REQUIRED];

  // Which fields to update. An absent mask replaces every mutable field.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request for DeleteTrack.
message DeleteTrackRequest {
  // The resource name of the track to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "music.example.com/Track"}
  ];
}

// Request for WithdrawTrack.
message WithdrawTrackRequest {
  // The resource name of the track to withdraw.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "music.example.com/Track"}
  ];

  // Why the track is being withdrawn.
  string reason = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request for WatchTracks.
message WatchTracksRequest {
  // The artist to watch.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "music.example.com/Track"}
  ];
}

// Response for WatchTracks.
//
// A custom method returns its own response message (AIP-136), which also leaves
// room to carry stream-level metadata later without breaking clients.
message WatchTracksResponse {
  // The track that was added or changed.
  Track track = 1;
}
