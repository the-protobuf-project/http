version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/examples/music-go"
      - "/plugin"
      - "/transcode-go"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directories:
      - "/" # the workspace: transcode, transcode-build, examples/music-rs
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
